[tool.poetry]
name = "excel-comparison-tool"
version = "1.0.0"
description = "Row-by-row Excel comparison with Polars and openpyxl"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12.4,<3.13"
polars = ">=2.0,<3.0"
openpyxl = ">=3.1,<4.0"

[tool.ruff]
line-length = 120
target-version = "py312"

[build-system]
requires = ["poetry-core>=2.0"]
build-backend = "poetry.core.masonry.api"
